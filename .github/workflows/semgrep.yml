# Semgrep SAST
#
# CodeQL does not support PHP, so it only scans the small amount of
# client-side JavaScript in this repo. Semgrep's OSS engine does support
# PHP and runs here with the free, public "p/php" and "p/security-audit"
# rule packs - no account, token, or third-party service required. It
# scans entirely inside the GitHub-hosted runner and uploads results as
# SARIF to the same Code Scanning tab CodeQL uses.
#
# Zwei getrennte Scans, bewusst nicht einer:
#   1. Voller Scan (alle Severities inkl. INFO/WARNING) - rein informativ,
#      landet als SARIF im Security-Tab, blockiert nie (continue-on-error).
#   2. Gate-Scan, nur ERROR-Severity - kein continue-on-error, lässt den Job
#      (und damit den Required Check "Semgrep SAST") fehlschlagen. Nur
#      echte, hochsichere Funde blockieren einen Merge; die breiteren
#      Audit-Treffer aus Scan 1 bleiben sichtbar, aber nicht blockierend.
name: Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 6 * * 1"
  # Manueller Auslöser: nötig, um nach GitHub-Actions-Störungen (bei denen
  # push-/pull_request-Läufe teils gar nicht erst angelegt werden) den als
  # Pflicht-Check konfigurierten Lauf für einen Branch nachholen zu können
  # (analog tests.yml).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      # Per Digest festgenagelt (Supply-Chain-Härtung). Achtung: Dependabot
      # (docker) erfasst nur Dockerfile/Compose, NICHT container:-Images in
      # Workflows — dieser Digest wird also manuell/periodisch nachgezogen.
      image: semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep (voller Scan für Security-Tab)
        run: semgrep scan --config=p/php --config=p/security-audit --config=p/owasp-top-ten --sarif --output=semgrep-results.sarif
        continue-on-error: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: semgrep-results.sarif

      - name: Gate auf ERROR-Findings
        # --error ist hier zwingend: "semgrep scan" beendet sich ohne dieses
        # Flag auch dann mit Exit 0, wenn es Funde meldet ("N blocking" in der
        # Zusammenfassung). Der Gate-Schritt sah damit lange grün aus, obwohl
        # zwei ERROR-Funde offenstanden - ein Pflicht-Check, der nie blockte.
        run: semgrep scan --config=p/php --config=p/security-audit --config=p/owasp-top-ten --severity ERROR --error
