name: 🐛 Bug Report
description: Einen Fehler im Hengstverzeichnis Framework melden
labels: ["bug", "beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du dir die Zeit nimmst, einen Bug zu melden! Sicherheitslücken
        bitte **nicht** hier melden, sondern vertraulich über
        [Security Advisories](../../security/advisories/new) (siehe [SECURITY.md](../../SECURITY.md)).
  - type: textarea
    id: description
    attributes:
      label: Was ist passiert?
      description: Kurze Beschreibung des Problems.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version/Commit
      placeholder: z. B. v0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment-Art
      options:
        - Docker/Docker Compose
        - Klassisches Shared-Hosting (Setup-Wizard)
        - Anderes/Unbekannt
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Umgebung
      placeholder: PHP-Version, MySQL/MariaDB-Version, Browser, Betriebssystem, Reverse Proxy (falls vorhanden), ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevante Logs/Screenshots
      description: Bitte keine echten personenbezogenen Daten oder Secrets (Passwörter, APP_KEY, DB-Zugangsdaten) einfügen.
      render: shell
    validations:
      required: false
