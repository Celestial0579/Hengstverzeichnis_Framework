# OpenSSF Scorecard
#
# Bewertet die Supply-Chain-/Governance-Posture des Repos laufend (Branch-Schutz,
# gepinnte Abhängigkeiten, Token-Rechte, gefährliche Workflows, …) und lädt das
# Ergebnis als SARIF ins Code-Scanning (Security-Tab). publish_results macht die
# Bewertung öffentlich abrufbar (Grundlage für den Scorecard-Badge).
name: Scorecard

on:
  # Neu-Bewertung, wenn sich Branch-Schutzregeln ändern.
  branch_protection_rule:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # SARIF ins Code-Scanning hochladen
      id-token: write          # OIDC für publish_results (keyless)
      contents: read
      actions: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
