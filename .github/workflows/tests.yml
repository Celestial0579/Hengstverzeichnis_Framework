# PHPUnit Test Suite
#
# Führt alle drei Testebenen aus (siehe docs/development.md, Abschnitt "Tests"):
#   - Unit:        reine Logik ohne DB (tests/Unit)
#   - Integration:  App\Database direkt im PHPUnit-Prozess gegen eine echte
#                   MariaDB-Testdatenbank (tests/Integration)
#   - Functional:   HTTP-Requests (curl) gegen eine per `php -S` gestartete
#                   Instanz - nötig, weil praktisch jede Controller-Aktion mit
#                   header()+exit; endet und sich daher nicht in-process testen
#                   lässt (tests/Functional)
# PHPUnit ist eine reine Dev-Abhängigkeit. Composer selbst ist für den
# Anwendungsbetrieb nicht nötig, weil vendor/ mit Zip und Image ausgeliefert
# wird - seit #353 steckt darin aber eine Laufzeitbibliothek
# (web-auth/webauthn-lib), composer.json ist also nicht mehr dev-only (siehe
# docs/development.md).
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Wiederverwendbar für release.yml, das denselben Testlauf als Gate vor
  # jedem Release braucht, ohne die Steps zu duplizieren.
  workflow_call:
  # Manueller Auslöser: nötig, um nach GitHub-Actions-Störungen (bei denen
  # push-/pull_request-Läufe teils gar nicht erst angelegt werden) den
  # Testlauf für einen Branch nachholen zu können, ohne Leer-Commits zu pushen.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: "8.5"
          extensions: pdo, pdo_mysql, curl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare test databases
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS hengst_integration;
            CREATE DATABASE IF NOT EXISTS hengst_functional;
            CREATE USER IF NOT EXISTS 'hengst'@'%' IDENTIFIED BY 'hengst';
            GRANT ALL PRIVILEGES ON *.* TO 'hengst'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "

      - name: Run Unit tests
        run: composer test -- --testsuite Unit

      - name: Run Integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: hengst_integration
          DB_USER: hengst
          DB_PASS: hengst
          APP_ENV: development
        run: composer test -- --testsuite Integration

      - name: Run Functional tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: hengst_functional
          DB_USER: hengst
          DB_PASS: hengst
          APP_ENV: development
          APP_KEY: ci-functional-test-key-not-for-production-use
          SITE_NAME: CI Testverband
          ADMIN_USERNAME: e2eadmin
          ADMIN_EMAIL: e2e-admin@example.com
          ADMIN_PASSWORD: FunctionalTest123!
        run: composer test -- --testsuite Functional

  # Rauchtest fuer das offizielle Docker-Image (Audit M31, N38, N41).
  #
  # PHPUnit sieht das Image nie: Ob Apache die Upload-Sperren aus
  # docker/apache-uploads.conf wirklich laedt, ob www-data var/ beschreiben
  # kann und ob storage/horses als Volume deklariert ist, zeigt nur ein
  # gebautes Image. Laeuft ueber workflow_call auch im Release-Gate, also
  # bevor ein Image nach GHCR geht. Ohne Datenbank - geprueft werden nur
  # Apache, Dateirechte und statische Auslieferung.
  docker-image:
    name: Docker-Image
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image and run smoke test
        run: tests/docker/image-smoke.sh
