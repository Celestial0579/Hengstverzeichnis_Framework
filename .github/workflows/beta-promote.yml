# Monatlicher Beta-Promote
#
# Öffnet am 1. jeden Monats automatisch eine Pull Request von `beta` nach
# `main`, sofern `beta` gegenüber `main` neue Commits hat (kein No-Op-Lauf,
# falls in einem Monat nichts auf beta gelandet ist).
#
# Der Merge selbst bleibt bewusst manuell: `main` verlangt (im Gegensatz zu
# `beta`, siehe docs/development.md) 1 Review + grüne Checks und ist auch
# Quelle des öffentlichen GHCR-"latest"-Images sowie des
# Shared-Hosting-Release-Archivs für alle Nutzer - nicht nur für den
# laufenden Beta-Test. "Ein Monat auf beta ohne gemeldeten Fehler" ersetzt
# also nicht den kurzen manuellen Blick vor dem Merge nach main.
name: Beta Promote

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: PR beta -> main öffnen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Auf neue Commits prüfen
        id: diff
        run: |
          git fetch origin main beta
          if [ -z "$(git log origin/main..origin/beta --oneline)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Request öffnen
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head beta \
            --title "Monatlicher Beta-Merge $(date +%Y-%m)" \
            --body "Automatisch erstellt: fasst die im letzten Monat auf \`beta\` getesteten Änderungen zusammen. Nach Review manuell mergen." \
            || echo "PR beta -> main existiert vermutlich schon offen"
