# Release-Pipeline
#
# Läuft bei jedem Push eines "v*"-Tags (z. B. v0.2.0). Baut/veröffentlicht
# NICHT die Release-Beschreibung - die bleibt bewusst manuell/kuratiert
# (siehe bestehende Releases, orientiert an CHANGELOG.md) - sondern
# ausschließlich die Artefakte:
#
#   1. Testsuite (Unit/Integration/Functional, siehe tests.yml) als Gate -
#      kein Release, wenn irgendetwas fehlschlägt.
#   2. Docker-Image, gebaut aus dem Dockerfile und nach GHCR gepusht
#      (ghcr.io/<repo>, Tags: Versionsnummer + "latest"). Bei Beta-Tags
#      (vX.Y.Z-beta.N, siehe docs/releasing.md) wird NICHT "latest"
#      überschrieben, sondern ein separater, mitlaufender "beta"-Tag
#      gepusht - "latest" bleibt für alle anderen Nutzer stabil.
#   3. Bereinigtes Source-Archiv für klassisches Shared-Hosting (ohne
#      Dev-Tooling wie tests/, composer.json, vendor/, .github/) als
#      herunterladbares Release-Asset.
#
# Falls für den Tag bereits ein (manuell erstellter) GitHub Release
# existiert, werden nur die Artefakte angehängt - Titel/Beschreibung bleiben
# unangetastet. Existiert noch keiner, wird ein leerer Release-Entwurf mit
# den Artefakten angelegt (Beschreibung dann manuell nachtragen), bei
# Beta-Tags als Pre-Release markiert.
#
# Hinweis: GHCR-Pakete sind über ein Repository-GITHUB_TOKEN standardmäßig
# privat sichtbar - nach dem ersten Release einmalig unter
# https://github.com/users/Celestial0579/packages/container/hengstverzeichnis_framework/settings
# auf "Public" stellen, damit `docker pull` ohne Login funktioniert.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    name: Build & Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Beta-Tags (vX.Y.Z-beta.N) dürfen niemals "latest" überschreiben -
          # das ist der stabile Kanal für alle anderen Nutzer. Sie bekommen
          # stattdessen einen eigenen, mitlaufenden "beta"-Tag.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-beta') }}
            type=raw,value=beta,enable=${{ contains(steps.version.outputs.version, '-beta') }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build Shared-Hosting-Archiv
        run: |
          mkdir -p dist
          git archive --format=zip \
            --output="dist/hengstverzeichnis-framework-${{ steps.version.outputs.version }}.zip" \
            --prefix="hengstverzeichnis-framework-${{ steps.version.outputs.version }}/" \
            HEAD -- \
            ':!tests' ':!.github' ':!.claude' ':!docker-compose.yml' \
            ':!Dockerfile' ':!.dockerignore' ':!docker-start.sh' \
            ':!composer.json' ':!composer.lock' ':!phpunit.xml'

      - name: Release erstellen/aktualisieren
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.zip
          prerelease: ${{ contains(steps.version.outputs.version, '-beta') }}
          # body/name absichtlich nicht gesetzt: bereits existierende,
          # manuell kuratierte Release-Beschreibung bleibt unangetastet.
