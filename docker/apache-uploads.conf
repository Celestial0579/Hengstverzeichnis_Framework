# Schutzregeln fuer public/uploads im offiziellen Docker-Image (Audit N41).
#
# WARUM HIER UND NICHT (NUR) IN DER .htaccess: public/uploads ist im Container
# das Volume uploads_data. Docker fuellt ein Volume nur beim ALLERERSTEN Start
# aus dem Image, danach bleibt sein Inhalt stehen - auch die .htaccess darin.
# Jede spaetere Aenderung an den Regeln kam bei Bestandsinstallationen nie an:
#   - Installationen aus 0.7.x hatten weiter die Referer-Regel, die das eigene
#     Logo mit 403 beantwortete (#367).
#   - Die harte Sperre public/uploads/horses/.htaccess (#366) fehlte ganz, und
#     liegengebliebene Altfotos waren statisch abrufbar, auch die
#     depublizierter Pferde.
# Diese Datei liegt im Image, nicht im Volume, und gilt deshalb immer in der
# Fassung des laufenden Images. www-data kann sie nicht aendern.
#
# AllowOverride None: .htaccess-Dateien im Volume werden NICHT mehr
# ausgewertet, auch nicht in Unterordnern. Ein Schreibprimitiv fuer www-data
# kann so per eingeschleuster .htaccess keinen PHP-Handler mehr einschalten.
# Eigene Regeln gehoeren in eine Apache-Konfiguration eines abgeleiteten Images.
#
# ${APACHE_DOCUMENT_ROOT} setzt das Dockerfile per ENV; Apache loest es beim
# Start auf (dieselbe Technik wie der sed-Aufruf dort). public/.htaccess wirkt
# fuer /uploads weiter (Rewrite, Header), kann die Sperren hier aber nicht
# aufheben.
#
# Die Endungsliste im zweiten FilesMatch muss mit public/uploads/.htaccess
# uebereinstimmen - tests/Unit/Views/DockerImageTest.php prueft das.

<Directory "${APACHE_DOCUMENT_ROOT}/uploads">
    AllowOverride None
    Options -Indexes -ExecCGI -Includes

    # Punktdateien (.htaccess aus dem Volume, .user.ini usw.) nie ausliefern.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Kein Skript aus dem Upload-Verzeichnis ausfuehren oder ausliefern.
    <FilesMatch "\.(php|php\d*|phtml|pl|py|jsp|asp|sh|cgi|phar|inc)$">
        SetHandler default-handler
        Require all denied
    </FilesMatch>

    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>

    # Einbettungsschutz fuer die verbliebenen Bilder, z. B. das Logo (#262).
    <IfModule mod_headers.c>
        <FilesMatch "\.(jpe?g|png|gif|webp)$">
            Header set Cross-Origin-Resource-Policy "same-origin"
            Header set X-Content-Type-Options "nosniff"
        </FilesMatch>
    </IfModule>
</Directory>

# Pferdefotos werden NIE statisch ausgeliefert (#366), nur ueber
# /media/horse-image mit Sichtbarkeitspruefung. Die Autorisierung laeuft vor dem
# per-dir-Rewrite aus public/.htaccess, deshalb bleibt es auch fuer nicht
# existierende Dateien bei 403.
<Directory "${APACHE_DOCUMENT_ROOT}/uploads/horses">
    Require all denied
</Directory>
