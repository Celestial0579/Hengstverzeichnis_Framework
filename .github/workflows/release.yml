# Release-Pipeline
#
# Läuft bei jedem Push eines "v*"-Tags (z. B. v0.2.0). Baut/veröffentlicht
# NICHT die Release-Beschreibung - die bleibt bewusst manuell/kuratiert
# (siehe bestehende Releases, orientiert an CHANGELOG.md) - sondern
# ausschließlich die Artefakte:
#
#   1. Testsuite (Unit/Integration/Functional, siehe tests.yml) als Gate -
#      kein Release, wenn irgendetwas fehlschlägt.
#   2. Docker-Image, gebaut aus dem Dockerfile und nach GHCR gepusht
#      (ghcr.io/<repo>, Tags: Versionsnummer + "latest").
#   3. Bereinigtes Source-Archiv für klassisches Shared-Hosting (ohne
#      Dev-Tooling wie tests/, composer.json, vendor/, .github/) als
#      herunterladbares Release-Asset.
#
# Falls für den Tag bereits ein (manuell erstellter) GitHub Release
# existiert, werden nur die Artefakte angehängt - Titel/Beschreibung bleiben
# unangetastet. Existiert noch keiner, wird ein leerer Release-Entwurf mit
# den Artefakten angelegt (Beschreibung dann manuell nachtragen).
#
# Hinweis: GHCR-Pakete sind über ein Repository-GITHUB_TOKEN standardmäßig
# privat sichtbar - nach dem ersten Release einmalig unter
# https://github.com/users/Celestial0579/packages/container/hengstverzeichnis_framework/settings
# auf "Public" stellen, damit `docker pull` ohne Login funktioniert.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    name: Build & Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write   # SLSA-Build-Provenance anlegen
      id-token: write       # OIDC für keyless Signatur (Sigstore), keine Secrets

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Volle Historie samt Tags: scripts/kern-manifest.php liest aus den
          # alten Staenden, welche Kern-Dateien es einmal gab. Ein flacher
          # Klon kennt sie nicht - die Beweisliste waere dann still
          # unvollstaendig, und ein Update raeumte entsprechend weniger auf,
          # ohne dass es jemandem auffiele.
          fetch-depth: 0

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Nicht auf das PHP der Runner-Vorgabe verlassen: Welche Fassung dort
      # liegt, kann sich mit dem Image aendern, und kern-manifest.php liefe
      # dann eines Tages gegen eine andere Sprachversion als der Rest des
      # Projekts. Dieselbe Pinnung wie in tests.yml und pre-commit.yml.
      - name: PHP bereitstellen
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2.37.2)
        with:
          php-version: '8.5'
          coverage: none

      - name: Kern-Listen erzeugen
        run: |
          mkdir -p dist/listen
          php scripts/kern-manifest.php dist/listen
          # In die Wurzel, BEVOR das Docker-Image gebaut wird: Dessen
          # `COPY . .` nimmt sie damit mit, und eine Container-Installation
          # kann sich genauso pruefen wie eine auf Shared Hosting. Stuenden
          # sie erst danach da, waere die Pruefung ausgerechnet dort blind,
          # wo der Codebaum root gehoert und eine Abweichung am meisten
          # bedeutet.
          cp dist/listen/KERN-SHA256SUMS.txt dist/listen/ABGELOESTE-DATEIEN.txt .

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attestiere Image-Provenance (SLSA, keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Zwei Listen ueber den eigenen Codebaum (#403):
      #   KERN-SHA256SUMS.txt     Sollzustand dieser Version - Grundlage fuer
      #                           Integritaetspruefung und Selbstreparatur.
      #   ABGELOESTE-DATEIEN.txt  Was fruehere Versionen ausgeliefert haben und
      #                           diese nicht mehr - Grundlage dafuer, dass ein
      #                           Update beim Aufraeumen BEWEISEN kann, dass
      #                           eine vorgefundene Datei von uns stammt und
      #                           niemand sie angefasst hat.
      #
      # Braucht die volle Tag-Historie, deshalb steht beim Checkout
      # fetch-depth: 0 - ein flacher Klon kennt die alten Staende nicht und
      # erzeugte eine stillschweigend unvollstaendige Beweisliste.
      - name: Build Shared-Hosting-Archiv
        run: |
          mkdir -p dist
          stage="dist/hengstverzeichnis-framework-${{ steps.version.outputs.version }}"
          mkdir -p "$stage"
          git archive --format=tar HEAD -- \
            ':!tests' ':!.github' ':!.claude' ':!docker-compose.yml' \
            ':!Dockerfile' ':!.dockerignore' ':!docker-start.sh' \
            ':!composer.json' ':!composer.lock' ':!phpunit.xml' ':!scripts' \
            | tar -C "$stage" -xf -
          # Die beiden Listen sind nicht versioniert - sie entstehen erst hier
          # und werden deshalb neben das Archiv gelegt, nicht hineingecheckt.
          cp KERN-SHA256SUMS.txt ABGELOESTE-DATEIEN.txt "$stage/"
          (cd dist && zip -qrX \
            "hengstverzeichnis-framework-${{ steps.version.outputs.version }}.zip" \
            "hengstverzeichnis-framework-${{ steps.version.outputs.version }}")
          rm -rf "$stage"

      - name: Checksumme fürs Archiv
        run: |
          cd dist
          rm -rf listen
          sha256sum *.zip > SHA256SUMS.txt

      - name: Attestiere Archiv-Provenance (SLSA, keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            KERN-SHA256SUMS.txt
            ABGELOESTE-DATEIEN.txt

      - name: Release erstellen/aktualisieren
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          # Vorabversionen ausdrücklich als solche kennzeichnen.
          #
          # Das ist keine Kosmetik: App\Service\UpdateService liest den
          # prerelease-Schalter von GitHub, um den Beta-Kanal vom stabilen zu
          # trennen (CHANNEL_BETA). Ohne diese Zeile bekämen ALLE Instanzen ein
          # v0.8.0-beta.1 als reguläres Update angeboten - der Kanal wäre
          # wirkungslos, und zwar in der gefährlichen Richtung.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Die beiden Kern-Listen werden auch EINZELN veroeffentlicht, nicht
          # nur im Zip. Das ist der ganze Punkt: Eine Integritaetspruefung,
          # deren Sollwert im selben Dateibaum liegt wie die geprueften
          # Dateien, findet keinen Angreifer, der beides anfasst (#403). Von
          # hier geholt liegt der Sollwert ausserhalb seiner Reichweite.
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            KERN-SHA256SUMS.txt
            ABGELOESTE-DATEIEN.txt
          # body/name absichtlich nicht gesetzt: bereits existierende,
          # manuell kuratierte Release-Beschreibung bleibt unangetastet.
