# Aktualisierung im Container: Das In-Place-Selbstupdate (/admin/updates) ist im
# Image bewusst ABgeschaltet (UPDATE_IN_PLACE=0 im Dockerfile) - der Code gehört
# root und darf vom Web-Prozess (www-data) aus Sicherheitsgründen nicht
# überschrieben werden. Der Updates-Screen zeigt weiterhin an, ob ein neues
# Release vorliegt; aktualisiert wird über ein NEUES IMAGE:
#   docker compose pull && docker compose up -d
# Automatisieren lässt sich das mit einem Watchtower-Fork (siehe der unten
# auskommentierte Dienst). Migrationen laufen wie gewohnt beim nächsten Aufruf.
services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/var/www/html/public/uploads
      # Installierte Addons überleben den Image-Wechsel. Ohne dieses Volume
      # nimmt der dokumentierte Update-Weg (`docker compose pull && up -d`)
      # jedes über den Addon-Store installierte Addon mit - das Verzeichnis
      # liegt im Container-Dateisystem, nicht in einem Volume, und ein neuer
      # Container startet mit dem leeren plugins/ aus dem Image. Die
      # Datenbankzeilen in `plugins` blieben dabei stehen, die Dateien nicht:
      # Der Betreiber sieht nach dem Update aktivierte Addons, deren Code weg
      # ist. Im Image ist das Verzeichnis leer (nur .gitkeep), es wird also
      # nichts Veraltetes in das Volume eingefroren.
      - plugins_data:/var/www/html/plugins
      # HINWEIS zu config/db_config.php: Diese Datei entsteht erst zur
      # Laufzeit und nimmt auf, was im Admin-Bereich unter Systemeinstellungen
      # gepflegt wird - TRUSTED_PROXIES, die Embed-Freigabe, Tracking- und
      # Captcha-Domains, die OIDC-Zugangsdaten. Auch sie liegt im
      # Container-Dateisystem und ist nach einem Image-Wechsel weg.
      #
      # Ein Volume über config/ wäre der falsche Weg: Docker kopiert den
      # Image-Inhalt einmalig hinein, und danach bliebe config/config.php -
      # also CODE - auf dem Stand des ersten Starts stehen, während das Image
      # weiterzieht. Genau die Sorte stiller Fehler, die man erst Monate
      # später bemerkt.
      #
      # Wer diese Einstellungen im Container pflegen will, bindet deshalb
      # gezielt die eine Datei ein (vorher auf dem Host anlegen, sonst legt
      # Docker ein Verzeichnis an):
      #   touch ./db_config.php
      #   - ./db_config.php:/var/www/html/config/db_config.php
      # Der empfohlene Weg im Container bleibt, alles über .env zu setzen -
      # Umgebungsvariablen haben ohnehin Vorrang (siehe config/config.php).

  # Optionaler Auto-Updater für den Container-Weg: zieht ein neues Image und
  # startet den Container neu, sobald ein Release veröffentlicht ist. Ersetzt
  # das im Image abgeschaltete In-Place-Update. Zum Aktivieren einkommentieren.
  # watchtower:
  #   image: ghcr.io/nicholas-fedor/watchtower   # nickfedor/watchtower (gepflegter Fork)
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --cleanup --interval 3600
  #   restart: unless-stopped

  db:
    image: mariadb:11@sha256:d9f7eb2637296652f24b484afd5d246f759f49f5babcadc6a9e344c9acb75fbf
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MARIADB_DATABASE: ${DB_NAME:-hengstverzeichnis}
      MARIADB_USER: ${DB_USER:-hengst_user}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads_data:
  plugins_data:
