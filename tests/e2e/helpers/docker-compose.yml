# Wegwerf-Backup-Ziele + Mailserver für den E2E-Nachtlauf. Nur Testdaten auf
# einem internen Netz; die Zugangsdaten sind bewusst feste Wegwerf-Werte. Der
# echte Host-Mailserver wird NICHT angefasst - dafür mailpit.
networks:
  e2e:
    name: ${E2E_NET:-hv-e2e-net}
    external: true

services:
  s3:
    # S3-Ziel (#516): versitygw mit Dateisystem-Backend statt MinIO, dessen
    # Images (minio/minio, minio/mc) es auf Docker Hub nicht mehr gibt. Per
    # Digest gepinnt (Scorecard Pinned-Dependencies); v1.10.0 vom 22.10.2026.
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    command: ["--access", "e2es3admin", "--secret", "s3-e2e-testpass", "--port", ":9000", "posix", "/tmp"]
    networks:
      e2e:
        aliases: [e2e-s3]
    restart: unless-stopped

  webdav:
    build: ./wsgidav
    networks:
      e2e:
        aliases: [e2e-webdav]
    restart: unless-stopped

  ftps:
    build: ./pyftps
    environment:
      FTP_USER_PASS: ftps-e2e-testpass
    networks:
      e2e:
        aliases: [e2e-ftps]
    restart: unless-stopped

  # mailpit: fängt SMTP ab (STARTTLS mit dem von spinup.sh erzeugten Cert, dessen
  # SAN auf 'e2e-mail' lautet - der App-Container vertraut ihm). Der Mailer der
  # App verbietet Klartext-SMTP und prüft den Peer, deshalb TLS + Cert.
  mailpit:
    # Per Digest gepinnt (Scorecard Pinned-Dependencies); Stand: v1.33.0 (2026-10-31)
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_TLS_CERT: /cert/cert.pem
      MP_SMTP_TLS_KEY: /cert/cert.key
    volumes:
      - ${E2E_CERT_DIR:-./certs}:/cert:ro
    networks:
      e2e:
        aliases: [e2e-mail]
    restart: unless-stopped
