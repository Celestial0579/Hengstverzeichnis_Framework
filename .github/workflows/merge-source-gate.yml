# Merge-Source-Gate für main
#
# main soll ausschließlich über den monatlichen beta -> main Promote
# (siehe beta-promote.yml) wachsen - direkte Feature-/Fix-PRs landen zuerst
# auf beta (siehe docs/development.md#branches). Dieser Check ist auf main
# als Required Status Check eingetragen und lässt nur zwei Quellen für eine
# PR nach main zu:
#   - den beta-Branch selbst (der reguläre Promote-Weg)
#   - Dependabot-PRs (dependabot.yml zielt direkt auf main, siehe
#     dependabot-auto-merge.yml - Versions-Bumps sind sicherheitsrelevant
#     zeitkritisch und laufen bewusst nicht erst durch den Beta-Zyklus)
# Alle anderen Branches scheitern hier bewusst, damit main nicht versehentlich
# per Direkt-PR umgangen wird.
name: Merge Source Gate

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check-source:
    name: Quelle prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Nur beta oder Dependabot dürfen nach main
        env:
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$HEAD_REF" = "beta" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "OK: PR kommt von '$HEAD_REF' (Actor: $ACTOR)."
            exit 0
          fi
          echo "::error::PRs nach main sind nur vom beta-Branch (monatlicher Promote) oder von Dependabot erlaubt. '$HEAD_REF' bitte zuerst als PR nach beta öffnen, siehe docs/development.md#branches."
          exit 1
